[project]
name = "pureini"
version = "0.10.0"
description = "CloudINI-compatible point cloud compression implemented in Rust"
readme = "README.md"
authors = [
    { name = "Marko Bausch", email = "60338487+mrkbac@users.noreply.github.com" }
]
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "numpy>=2.2.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/mrkbac/robotic-tools/tree/main/pureini"
Repository = "https://github.com/mrkbac/robotic-tools"
Issues = "https://github.com/mrkbac/robotic-tools/issues"

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "pureini._pureini"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.pyc"]
bindings = "pyo3"
features = ["pyo3/extension-module"]
strip = true
