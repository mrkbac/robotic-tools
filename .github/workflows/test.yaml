name: Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  optional-dependencies:
    name: optional dependency wheel matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true
          cache-suffix: optional-dependencies

      - name: Build workspace wheels
        run: uv build --all-packages --wheel --out-dir dist/optional-dependencies

      - name: Test base install and each extra independently
        env:
          UV_FIND_LINKS: dist/optional-dependencies
        run: >-
          uv run --no-project --python 3.13 python
          pymcap-cli/tests/check_optional_dependencies.py
          dist/optional-dependencies/pymcap_cli-*.whl

      - name: Test codec-support base install and each extra independently
        env:
          UV_FIND_LINKS: dist/optional-dependencies
        run: >-
          uv run --no-project --python 3.13 python
          mcap-codec-support/tests/check_optional_dependencies.py
          dist/optional-dependencies/mcap_codec_support-*.whl

      - name: Test small-mcap base install and each extra independently
        env:
          UV_FIND_LINKS: dist/optional-dependencies
        run: >-
          uv run --no-project --python 3.13 python
          small-mcap/tests/check_optional_dependencies.py
          dist/optional-dependencies/small_mcap-*.whl

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        package:
          - { dir: small-mcap, cov: true, config: small-mcap/pyproject.toml, submodules: true }
          - { dir: pymcap-cli, cov: true, config: pymcap-cli/pyproject.toml, submodules: true }
          - { dir: mcap-ros2-support-fast, cov: true, config: mcap-ros2-support-fast/pyproject.toml, submodules: true }
          - { dir: mcap-codec-support, cov: true, config: mcap-codec-support/pyproject.toml, submodules: false }
          - { dir: ros-parser, cov: true, config: ros-parser/pyproject.toml, submodules: false }
          - { dir: pointcloud2, cov: true, config: pointcloud2/pyproject.toml, submodules: false }
          - { dir: pureini, cov: false, config: pyproject.toml, submodules: false }
          - { dir: robo-ws-bridge, cov: true, config: robo-ws-bridge/pyproject.toml, submodules: false }
          - { dir: digitalis, cov: true, config: digitalis/pyproject.toml, submodules: false }

    name: test (${{ matrix.package.dir }}, ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ matrix.package.submodules }}

      - name: Compute submodule cache key
        if: matrix.package.submodules
        id: submodule-key
        run: echo "hash=$(git ls-tree HEAD data/ | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache submodules
        if: matrix.package.submodules
        id: submodule-cache
        uses: actions/cache@v5
        with:
          path: |
            data/data
            data/mcap
          key: submodules-${{ runner.os }}-${{ steps.submodule-key.outputs.hash }}

      - name: Checkout submodules
        if: matrix.package.submodules && steps.submodule-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth=1
          git submodule foreach --recursive 'git lfs pull'

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          prune-cache: true
          cache-suffix: test-${{ matrix.package.dir }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras --all-packages

      - name: Install PureINI minimum Rust toolchain
        if: matrix.package.dir == 'pureini' && matrix.python-version == '3.13'
        uses: dtolnay/rust-toolchain@1.88

      - name: Run PureINI Rust unit tests at MSRV
        if: matrix.package.dir == 'pureini' && matrix.python-version == '3.13'
        run: |
          python_libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          LD_LIBRARY_PATH="${python_libdir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            uv run --frozen cargo test --manifest-path pureini/rust/Cargo.toml

      - name: Install mcap CLI
        if: matrix.package.dir == 'pymcap-cli'
        run: |
          curl -L https://github.com/foxglove/mcap/releases/download/releases%2Fmcap-cli%2Fv0.0.57/mcap-linux-amd64 -o /tmp/mcap
          chmod +x /tmp/mcap
          sudo mv /tmp/mcap /usr/local/bin/mcap
          mcap version

      - name: Run tests
        run: |
          if [ "${{ matrix.package.cov }}" = "true" ]; then
            cov_module=$(echo "${{ matrix.package.dir }}" | tr '-' '_')
            uv run pytest \
              ${{ matrix.package.dir }}/tests \
              -v \
              -m "not benchmark" \
              --benchmark-skip \
              --cov=${{ matrix.package.dir }}/src/$cov_module \
              --cov-config=${{ matrix.package.config }} \
              --cov-report=term-missing \
              --cov-report=xml:coverage-${{ matrix.package.dir }}.xml \
              -n auto
          else
            uv run pytest ${{ matrix.package.dir }}/tests -v --no-cov -m "not benchmark" -n auto
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.package.cov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.package.dir }}
          files: coverage-${{ matrix.package.dir }}.xml
          disable_search: true

  pureini-rust-coverage:
    name: pureini Rust coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          prune-cache: true
          cache-suffix: pureini-rust-coverage

      - name: Install PureINI minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure Rust coverage
        shell: bash
        run: |
          python_libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export PYO3_PYTHON="$(command -v python)"
          export LD_LIBRARY_PATH="${python_libdir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

          cd pureini/rust
          cargo llvm-cov clean --workspace
          eval "$(cargo llvm-cov show-env --sh)"
          cargo test --release
          cd ../..

          uv build --package pureini --wheel --out-dir dist/pureini-coverage
          pureini_wheel=$(find dist/pureini-coverage -name 'pureini-*.whl' -print -quit)
          uv run \
            --isolated \
            --no-project \
            --python 3.13 \
            --with "$pureini_wheel" \
            --with pytest \
            --with numpy \
            python -m pytest pureini/tests -m "not benchmark" -q

          cd pureini/rust
          cargo llvm-cov report \
            --release \
            --fail-under-lines 71.8 \
            --lcov \
            --output-path ../../pureini-rust.lcov

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: pureini-rust
          files: pureini-rust.lcov
          disable_search: true

  pureini-wheel:
    name: pureini wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-24.04, target: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: linux-aarch64 }
          - { runner: macos-15-intel, target: macos-x86_64 }
          - { runner: macos-15, target: macos-aarch64 }
          - { runner: windows-2025, target: windows-x86_64 }

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          prune-cache: true
          cache-suffix: pureini-wheel-${{ matrix.platform.target }}

      - name: Build native wheel
        run: uv build --package pureini --wheel --out-dir dist/pureini

      - name: Test exact wheel on oldest and newest Python
        shell: bash
        run: |
          wheel=$(find dist/pureini -name 'pureini-*.whl' -print -quit)
          test -n "$wheel"
          for python_version in 3.10 3.14; do
            uv run --isolated --no-project \
              --python "$python_version" \
              --with "$wheel" \
              --with numpy \
              --with pytest \
              --with pytest-cov \
              python -m pytest pureini/tests \
              -m "not benchmark" \
              --no-cov \
              -q
          done

      - name: Test installed PyMcap CLI point-cloud integration
        if: matrix.platform.target == 'linux-x86_64'
        shell: bash
        run: |
          uv build --package mcap-codec-support --wheel --out-dir dist/integration
          uv build --package pymcap-cli --wheel --out-dir dist/integration
          pureini_wheel=$(find dist/pureini -name 'pureini-*.whl' -print -quit)
          codec_wheel=$(find dist/integration -name 'mcap_codec_support-*.whl' -print -quit)
          cli_wheel=$(find dist/integration -name 'pymcap_cli-*.whl' -print -quit)
          test -n "$pureini_wheel"
          test -n "$codec_wheel"
          test -n "$cli_wheel"
          uv run --isolated --no-project \
            --python 3.14 \
            --with "$pureini_wheel" \
            --with "${codec_wheel}[pointcloud]" \
            --with "${cli_wheel}[pointcloud]" \
            --with numpy \
            --with pointcloud2 \
            --with pillow \
            --with portable-ffmpeg \
            --with pytest \
            --with pytest-cov \
            python -m pytest \
            mcap-codec-support/tests/test_compression.py \
            pymcap-cli/tests/test_pointcloud_compress_processor.py \
            --no-cov \
            -q

  pureini-sdist:
    name: pureini sdist rebuild
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          prune-cache: true
          cache-suffix: pureini-sdist

      - name: Build sdist and rebuild its wheel
        shell: bash
        run: |
          uv build --package pureini --sdist --out-dir dist/sdist
          sdist=$(find dist/sdist -name 'pureini-*.tar.gz' -print -quit)
          test -n "$sdist"
          uv build "$sdist" --wheel --out-dir dist/rebuilt

      - name: Test rebuilt wheel
        shell: bash
        run: |
          wheel=$(find dist/rebuilt -name 'pureini-*.whl' -print -quit)
          test -n "$wheel"
          uv run --isolated --no-project \
            --python 3.14 \
            --with "$wheel" \
            --with numpy \
            --with pytest \
            --with pytest-cov \
            python -m pytest pureini/tests \
            -m "not benchmark" \
            --no-cov \
            -q
